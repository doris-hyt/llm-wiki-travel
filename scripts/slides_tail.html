<div id="nav">
  <button id="prev" aria-label="上一張">← 上一張</button>
  <span id="count" style="font-size:16px;color:var(--muted)"></span>
  <button id="next" aria-label="下一張">下一張 →</button>
</div>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var i=0;
  try{ var h=parseInt(location.hash.replace('#',''),10); if(h>=1&&h<=slides.length) i=h-1; }catch(e){}
  var stage=document.getElementById('stage');
  function fit(){
    var s=Math.min((window.innerWidth-32)/1280,(window.innerHeight-56)/720);
    stage.style.transform='translate(-50%,-50%) scale('+s+')';
  }
  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach(function(el,k){ el.classList.toggle('active',k===i); });
    document.getElementById('count').textContent=(i+1)+' / '+slides.length;
    document.getElementById('bar').style.width=((i+1)/slides.length*100)+'%';
    try{ history.replaceState(null,'','#'+(i+1)); }catch(e){}
  }
  document.getElementById('prev').onclick=function(){show(i-1)};
  document.getElementById('next').onclick=function(){show(i+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();show(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(i-1)}
    else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(slides.length-1)}
  });
  var x0=null;
  document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){ if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) show(i+(dx<0?1:-1)); x0=null; },{passive:true});
  window.addEventListener('resize',fit);
  fit(); show(i);
})();
</script>
</body>
</html>
